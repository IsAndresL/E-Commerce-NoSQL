services:
  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    ports:
      - "6379:6379"
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb-local
    ports:
      - "8001:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "echo > /dev/tcp/localhost/8000 && echo healthy || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  awscli:
    image: amazon/aws-cli:latest
    container_name: awscli
    depends_on:
      dynamodb-local:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://dynamodb-local:8000
      AWS_PAGER: ""
    entrypoint: ["tail", "-f", "/dev/null"]
    networks:
      - ecommerce-net

  ministack:
    image: ministackorg/ministack:latest
    container_name: infra_ministack
    ports:
      - "4566:4566"
    environment:
      LAMBDA_EXECUTOR: docker
      DOCKER_NETWORK: ecommerce-net
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - lambda-docker-volume:/var/task
    networks:
      - ecommerce-net

  # backend service removed (now using Lambdas + LocalStack)

  frontend:
    image: node:22-alpine
    container_name: ecommerce-frontend
    working_dir: /app/frontend
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
    environment:
      VITE_API_PROXY_TARGET: http://ministack:4566
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - ecommerce-net

  deployer:
    build:
      context: .
      dockerfile: deployer/Dockerfile
    container_name: ecommerce-deployer
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      - ministack
      - dynamodb-local
      - redis
    networks:
      - ecommerce-net

networks:
  ecommerce-net:
    driver: bridge
    name: ecommerce-net

volumes:
  lambda-docker-volume:
    driver: local

